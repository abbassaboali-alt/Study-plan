    <!-- Approved Host Guard & Early Shortcut Deterrent -->
    <script>
      (function(){
        "use strict";
        const LOGIN = "https://www.prudle-education.com/log-in-out";
        const allowed = new Set(["www.prudle-education.com", "prudle-education.com", "abbassaboali-alt.github.io"]);
        const host = location.hostname.toLowerCase();
        const isDev = host === "localhost" || host === "127.0.0.1" || host.includes(".run.app");
        if(!isDev && (location.protocol !== "https:" || !allowed.has(host))){
          window.stop();
          location.replace(LOGIN);
          return;
        }
        window.addEventListener("keydown", function(e){
          if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){
            e.preventDefault();
          }
        }, true);
      })();
    </script>
