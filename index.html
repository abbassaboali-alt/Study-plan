/* ================= HELPERS ================= */
function escapeHtml(str){
  return String(str ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function formatPeriodSort(v){
  return String(v || "").trim();
}
function getCourseDuration(course){

  const raw =
    course.Duration ??
    course.Weeks ??
    course.duration ??
    course.weeks ??
    "";

  const text =
    String(raw)
      .trim()
      .toLowerCase();

  /* قيمة رقمية مباشرة */
  const numericValue = Number(text);

  if(
    Number.isFinite(numericValue) &&
    numericValue > 0
  ){
    return numericValue;
  }

  /* القيم العربية */
  if(
    text === "أسبوع" ||
    text === "اسبوع" ||
    text === "أسبوع واحد" ||
    text === "اسبوع واحد"
  ){
    return 1;
  }

  if(
    text === "أسبوعان" ||
    text === "اسبوعان" ||
    text === "أسبوعين" ||
    text === "اسبوعين"
  ){
    return 2;
  }

  /* القيم الإنجليزية */
  if(
    text === "1 week" ||
    text === "one week"
  ){
    return 1;
  }

  if(
    text === "2 weeks" ||
    text === "two weeks"
  ){
    return 2;
  }

  /* استخراج أي رقم داخل النص */
  const match =
    text.match(/\d+/);

  if(match){

    const extracted =
      Number(match[0]);

    if(
      Number.isFinite(extracted) &&
      extracted > 0
    ){
      return extracted;
    }

  }

  /* مدة افتراضية عند عدم وجود قيمة صالحة */
  return 8;
}

function getCurrentWeek(startDate, duration){
  const start = new Date(startDate || 0);
  const now = new Date();

  if(isNaN(start.getTime())) return -1;

  const diffWeeks = Math.floor((now - start) / (1000*60*60*24*7)) + 1;

  if(diffWeeks < 1 || diffWeeks > duration) return -1;
  return diffWeeks;
}

async function upsertStudyPlan(
  courseId,
  week,
  day,
  activity
){

  const id =
    `${courseId}_${week}_${day}`;

  await db
    .collection("StudyPlans")
    .doc(id)
    .set({

      courseId,
      week,
      day,
      activity,

      updatedAt:
        firebase.firestore
          .FieldValue
          .serverTimestamp()

    });

}

async function tryAddImage(doc, url, x, y, w, h){
  try{
    const dataUrl = await urlToDataURL(url);
    doc.addImage(dataUrl, "PNG", x, y, w, h);
    return true;
  }catch(e){
    console.warn("Logo failed:", e);
    return false;
  }
}

function urlToDataURL(url){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function(){
      try{
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        resolve(canvas.toDataURL("image/png"));
      }catch(err){
        reject(err);
      }
    };
    img.onerror = reject;
    img.src = url;
  });
}

  el.innerHTML = `<option value="">${firstLabel}</option>`;

  vals.forEach(v=>{
    const o = document.createElement("option");
    o.value = v;
    o.textContent = v;
    el.appendChild(o);
  });

  el.onchange = applyFilters;
}

function fillDates(){
  const el = document.getElementById("fStartDate");

  const dates = [...new Set(COURSES.map(c => c.StartingDate).filter(Boolean))]
    .sort((a,b)=>new Date(b) - new Date(a));

  LATEST_5 = dates.slice(0,5);

  el.innerHTML = '<option value="">تاريخ البدء</option>';

  dates.forEach(d=>{
    const o = document.createElement("option");
    o.value = d;

    if(LATEST_5.includes(d)){
      o.textContent = `□ ${d}`;
      o.classList.add("latest-start");
    }else{
      o.textContent = d;
    }

    el.appendChild(o);
  });

  el.onchange = applyFilters;
}

/* ================= APPLY FILTERS ================= */
function applyFilters(){
  const fBranch = document.getElementById("fBranch");
  const fSection = document.getElementById("fSection");
  const fTrainer = document.getElementById("fTrainer");
  const fCourse = document.getElementById("fCourse");
  const fPeriod = document.getElementById("fPeriod");
  const fStartDate = document.getElementById("fStartDate");
  const totalCount = document.getElementById("totalCount");

  FILTERED_COURSES = COURSES.filter(c =>
    (!fBranch.value || c.Branch === fBranch.value) &&
    (!fSection.value || c.Section === fSection.value) &&
    (!fTrainer.value || c.Trainer === fTrainer.value) &&
    (!fCourse.value || c.TrainingCourse === fCourse.value) &&
    (!fPeriod.value || c.Period === fPeriod.value) &&
    (!fStartDate.value || c.StartingDate === fStartDate.value)
  );

  FILTERED_COURSES.sort((a,b)=>formatPeriodSort(a.Period).localeCompare(formatPeriodSort(b.Period),"ar"));

  totalCount.textContent = FILTERED_COURSES.length;
  renderPlans(FILTERED_COURSES);
}
function getPlanColorClass(text){

  const t = String(text || "").trim().toLowerCase();

  if(!t) return "";

  if(t.includes("final exam") || t.includes("final")){
    return "plan-final";
  }

  if(t.includes("midterm exam") || t.includes("midterm")){
    return "plan-midterm";
  }

  if(t.includes("quiz")){
    return "plan-quiz";
  }

  if(
    t.includes("activity") ||
    t.includes("reading") ||
    t.includes("listening") ||
    t.includes("speaking") ||
    t.includes("writing") ||
    t.includes("vocabulary") ||
    t.includes("grammar") ||
    t.includes("skills")
  ){
    return "plan-activity";
  }

  return "plan-normal";
}

function applyTextareaColor(textarea){

  const td = textarea.closest("td");
  if(!td) return;

  td.classList.remove(
    "plan-final",
    "plan-midterm",
    "plan-quiz",
    "plan-activity",
    "plan-normal"
  );

  const cls = getPlanColorClass(textarea.value);
  if(cls) td.classList.add(cls);
}

/* ================= LOAD SAVED ================= */
async function loadStudyPlan(courseId){

  try{

    const snap = await db.collection("StudyPlans")
      .where("courseId","==",courseId)
      .get();

    const map = {};

    snap.forEach(d=>{

      const p = d.data() || {};

      map[`${p.week}_${p.day}`] =
        p.activity || "";

    });

    document
      .querySelectorAll(
        `textarea[data-course="${courseId}"]`
      )
      .forEach(el=>{

        el.value =
          map[
            `${el.dataset.week}_${el.dataset.day}`
          ] || "";
applyTextareaColor(el);
      });

  }catch(err){

    console.error(err);

  }

}

/* ================= BULK ================= */
async function applyBulk(){

  if(!BULK_TARGET){

    alert(
      "حدد الأسبوع واليوم أولاً"
    );

    return;

  }

  if(!FILTERED_COURSES.length){

    alert(
      "لا توجد دورات مفلترة"
    );

    return;

  }

  const text =
    String(
      document.getElementById(
        "bulkText"
      ).value || ""
    ).trim();

  if(!text){

    alert("اكتب النشاط");

    return;

  }

  const {week, day} = BULK_TARGET;

  for(const c of FILTERED_COURSES){

    await upsertStudyPlan(
      c.id,
      week,
      day,
      text
    );

  }

  for(const c of FILTERED_COURSES){

    await loadStudyPlan(c.id);

  }

  alert("✅ تم الحفظ الجماعي");

}

/* ================= PDF ================= */
async function exportPlanPDF(){

  const statusBox = document.getElementById("pdfStatus");

  try{

    if(!FILTERED_COURSES.length){
      alert("لا توجد دورات");
      return;
    }

    if(statusBox){
      statusBox.style.display = "block";
      statusBox.textContent = "جاري تجهيز PDF بتصميم مضغوط مع الشعار...";
    }

    await new Promise(resolve => setTimeout(resolve, 80));

    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({
      orientation:"landscape",
      unit:"mm",
      format:"a4",
      compress:true
    });

    const BLUE = [22,68,120];
    const BLUE_DARK = [13,47,82];
    const LIGHT = [245,248,252];
    const W = doc.internal.pageSize.getWidth();
    const H = doc.internal.pageSize.getHeight();

    const sortedCourses = [...FILTERED_COURSES].sort((a,b)=>
      String(a.TrainingCourse || "").localeCompare(
        String(b.TrainingCourse || ""),
        "en",
        {sensitivity:"base"}
      )
    );

    if(statusBox){
      statusBox.textContent = "جاري تحميل الشعار مرة واحدة...";
    }

    let logoData = null;
    try{
      logoData = await urlToDataURL(LOGO_URL);
    }catch(e){
      console.warn("Logo failed:", e);
      logoData = null;
    }

    if(statusBox){
      statusBox.textContent = "جاري تحميل الخطط من قاعدة البيانات...";
    }

    const courseIds = new Set(sortedCourses.map(c => String(c.id)));
    const plansByCourse = {};

    const allPlansSnap = await db.collection("StudyPlans").get();

    allPlansSnap.forEach(d=>{
      const p = d.data() || {};
      const cid = String(p.courseId || "");

      if(!courseIds.has(cid)) return;

      if(!plansByCourse[cid]) plansByCourse[cid] = {};
      plansByCourse[cid][`${p.week}_${p.day}`] = p.activity || "";
    });

    let first = true;
    let index = 0;

    for(const course of sortedCourses){

      index++;

      if(statusBox){
        statusBox.textContent = `جاري إصدار PDF للدورة ${index} من ${sortedCourses.length}...`;
      }

      if(!first) doc.addPage();
      first = false;

      const duration =
  getCourseDuration(course);

      // ===== Header compact with logo =====
      doc.setFillColor(...BLUE);
      doc.rect(0,0,W,22,"F");

      if(logoData){
        doc.setFillColor(255,255,255);
        doc.roundedRect(8,3,17,16,2,2,"F");
        doc.addImage(logoData,"PNG",10,4.5,13,13);
      }else{
        doc.setTextColor(255,255,255);
        doc.setFont("helvetica","bold");
        doc.setFontSize(9);
        doc.text("PRUDLE", 10, 13);
      }

      doc.setTextColor(255,255,255);
      doc.setFont("helvetica","bold");
      doc.setFontSize(17);
      doc.text("PRUDLE STUDY PLAN", W/2, 9, {align:"center"});

      doc.setFontSize(10);
      doc.text(String(course.TrainingCourse || "-"), W/2, 17, {align:"center"});

      // ===== Course details in compact chips =====
      doc.setTextColor(20,30,45);
      doc.setFontSize(8);
      doc.setFont("helvetica","bold");

      const details = [
        `Course: ${course.TrainingCourse || "-"}`,
        `Trainer: ${course.Trainer || "-"}`,
        `Period: ${course.Period || "-"}`,
        `Start: ${course.StartingDate || "-"}`,
        `Duration: ${duration} Weeks`,
        `Branch: ${course.Branch || "-"}`,
        `Section: ${course.Section || "-"}`
      ];

      let x = 8;
      let y = 27;
      details.forEach((txt)=>{
        const clean = String(txt).slice(0,48);
        const chipW = Math.min(Math.max(doc.getTextWidth(clean) + 7, 30), 78);
        if(x + chipW > W - 8){
          x = 8;
          y += 7;
        }
        doc.setFillColor(...LIGHT);
        doc.setDrawColor(210,220,235);
        doc.roundedRect(x, y-4.5, chipW, 6, 1.5, 1.5, "FD");
        doc.text(clean, x+3, y);
        x += chipW + 3;
      });

      const map = plansByCourse[String(course.id)] || {};

      const daysAR = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
      const daysEN = ["Sunday","Monday","Tuesday","Wednesday","Thursday"];

      const head = [["Week", ...daysEN]];
      const body = [];

      for(let w=1; w<=duration; w++){
        const row = [`Week ${w}`];
        daysAR.forEach(day=>{
          row.push(String(map[`${w}_${day}`] || "").trim());
        });
        body.push(row);
      }

      const tableStartY = Math.max(42, y + 6);
      const marginX = 6;
      const usableW = W - (marginX*2);
      const weekW = 18;
      const dayW = (usableW - weekW) / 5;

      doc.autoTable({
        startY:tableStartY,
        theme:"grid",
        head,
        body,
        margin:{left:marginX,right:marginX,bottom:18},
        tableWidth:usableW,
        pageBreak:"auto",
        rowPageBreak:"avoid",
        headStyles:{
          fillColor:BLUE,
          textColor:[255,255,255],
          fontStyle:"bold",
          halign:"center",
          valign:"middle",
          fontSize:7.5,
          cellPadding:1.8,
          minCellHeight:6
        },
        styles:{
          font:"helvetica",
          fontSize:6.8,
          cellPadding:1.6,
          minCellHeight:6.2,
          halign:"center",
          valign:"middle",
          overflow:"linebreak",
          lineColor:[190,205,225],
          lineWidth:0.16
        },
        alternateRowStyles:{
          fillColor:[250,252,255]
        },
        columnStyles:{
          0:{cellWidth:weekW,fontStyle:"bold",fillColor:[235,241,250],textColor:BLUE_DARK},
          1:{cellWidth:dayW},
          2:{cellWidth:dayW},
          3:{cellWidth:dayW},
          4:{cellWidth:dayW},
          5:{cellWidth:dayW}
        },
        didParseCell:function(data){

          if(data.section === "body" && data.column.index > 0){

            const txt = String(data.cell.raw || "").trim().toLowerCase();

            if(txt.includes("final exam") || txt.includes("final")){
              data.cell.styles.fillColor = [220,53,69];
              data.cell.styles.textColor = [255,255,255];
              data.cell.styles.fontStyle = "bold";
            }
            else if(txt.includes("midterm exam") || txt.includes("midterm")){
              data.cell.styles.fillColor = [255,193,7];
              data.cell.styles.textColor = [0,0,0];
              data.cell.styles.fontStyle = "bold";
            }
            else if(txt.includes("quiz")){
              data.cell.styles.fillColor = [13,110,253];
              data.cell.styles.textColor = [255,255,255];
              data.cell.styles.fontStyle = "bold";
            }
            else if(
              txt.includes("activity") ||
              txt.includes("reading") ||
              txt.includes("listening") ||
              txt.includes("speaking") ||
              txt.includes("writing") ||
              txt.includes("vocabulary") ||
              txt.includes("grammar")
            ){
              data.cell.styles.fillColor = [25,135,84];
              data.cell.styles.textColor = [255,255,255];
              data.cell.styles.fontStyle = "bold";
            }
            else if(txt){
              data.cell.styles.fillColor = [255,250,225];
              data.cell.styles.textColor = [35,35,35];
            }
          }
        },
        didDrawPage:function(){
          doc.setFontSize(7);
          doc.setTextColor(120);
          doc.text("Prudle Institute - Study Plan", marginX, H-6);
          doc.text(`Page ${doc.internal.getCurrentPageInfo().pageNumber}`, W-marginX, H-6, {align:"right"});
        }
      });

      // ===== Compact color guide =====
      let finalY = (doc.lastAutoTable && doc.lastAutoTable.finalY ? doc.lastAutoTable.finalY : tableStartY) + 6;

      if(finalY > H - 20){
        finalY = H - 18;
      }

      doc.setFontSize(7.2);
      doc.setTextColor(0);
      doc.setFont("helvetica","bold");
      doc.text("Color Guide:", marginX, finalY);

      const guide = [
        {c:[220,53,69], t:"Final"},
        {c:[255,193,7], t:"Midterm"},
        {c:[13,110,253], t:"Quiz"},
        {c:[25,135,84], t:"Activity / Skills"}
      ];

      let gx = marginX + 24;
      guide.forEach(g=>{
        doc.setFillColor(...g.c);
        doc.rect(gx, finalY-4, 4, 4, "F");
        doc.setTextColor(0);
        doc.text(g.t, gx+6, finalY);
        gx += doc.getTextWidth(g.t) + 18;
      });

      await new Promise(resolve => setTimeout(resolve, 15));
    }

    if(statusBox){
      statusBox.textContent = "جاري تنزيل ملف PDF...";
    }

    doc.save("Prudle_StudyPlan_Report.pdf");

  }catch(err){

    console.error(err);
    alert("حدث خطأ أثناء إصدار PDF");

  }finally{

    if(statusBox){
      setTimeout(()=>{
        statusBox.style.display = "none";
      }, 1200);
    }

  }
}

async function loadSavedPlans(){
  try{
    const snap = await db.collection("StudyPlanTemplates").get();

    SAVED_PLANS = snap.docs
      .map(doc=>({
        id:doc.id,
        ...doc.data()
      }))
      .sort((a,b)=>
        String(a.name || "").localeCompare(
          String(b.name || ""),
          "ar"
        )
      );

    buildSavedPlanDropdown();

  }catch(error){
    console.error("Could not load saved plans:",error);
  }
}

function buildSavedPlanDropdown(){
  const select =
    document.getElementById("savedPlanSelect");

  if(!select) return;

  const oldValue = select.value;

  select.innerHTML =
    '<option value="">اختر خطة محفوظة</option>';

  SAVED_PLANS.forEach(plan=>{
    const option =
      document.createElement("option");

    option.value = plan.id;
    option.textContent =
      `${plan.name || "خطة بدون اسم"} — ${Number(plan.duration || 1)} Weeks`;

    select.appendChild(option);
  });

  if(SAVED_PLANS.some(plan=>plan.id === oldValue)){
    select.value = oldValue;
  }
}

function openSavedPlanModal(planId = ""){
  const modal =
    document.getElementById("savedPlanModal");

  if(!modal) return;

  ACTIVE_TEMPLATE_ID = planId || null;

  const nameInput =
    document.getElementById("templateName");

  const durationSelect =
    document.getElementById("templateDuration");

  const deleteButton =
    document.getElementById("deleteTemplateBtn");

  let selectedPlan = null;

  if(planId){
    selectedPlan =
      SAVED_PLANS.find(plan=>plan.id === planId) || null;
  }else{
    const selectedId =
      document.getElementById("savedPlanSelect")?.value || "";

    if(selectedId){
      selectedPlan =
        SAVED_PLANS.find(plan=>plan.id === selectedId) || null;

      ACTIVE_TEMPLATE_ID =
        selectedPlan?.id || null;
    }
  }

  nameInput.value =
    selectedPlan?.name || "";

  durationSelect.value =
    String(
      Number(selectedPlan?.duration || 8)
    );

  if(deleteButton){
    deleteButton.style.display =
      selectedPlan ? "inline-flex" : "none";
  }

  renderTemplateEditor(
    Number(durationSelect.value),
    selectedPlan?.items || []
  );

  durationSelect.onchange = function(){
    const currentItems =
      collectTemplateItems(false);

    renderTemplateEditor(
      Number(this.value),
      currentItems
    );
  };

  modal.style.display = "flex";
}

function closeSavedPlanModal(){
  const modal =
    document.getElementById("savedPlanModal");

  if(modal){
    modal.style.display = "none";
  }

  ACTIVE_TEMPLATE_ID = null;
}

function renderTemplateEditor(duration,items = []){
  const box =
    document.getElementById("templateEditorBox");

  if(!box) return;

  const days = [
    "الأحد",
    "الاثنين",
    "الثلاثاء",
    "الأربعاء",
    "الخميس"
  ];

  const itemMap = {};

  items.forEach(item=>{
    itemMap[
      `${Number(item.week)}_${String(item.day || "")}`
    ] = String(item.activity || "");
  });

  let html = `
    <div class="template-grid-wrap">
      <table class="template-grid">
        <thead>
          <tr>
            <th style="width:85px">الأسبوع</th>
  `;

  days.forEach(day=>{
    html += `<th>${escapeHtml(day)}</th>`;
  });

  html += `
          </tr>
        </thead>
        <tbody>
  `;

  for(let week = 1; week <= duration; week++){
    html += `
      <tr>
        <td><b>الأسبوع ${week}</b></td>
    `;

    days.forEach(day=>{
      const value =
        itemMap[`${week}_${day}`] || "";

      html += `
        <td>
          <textarea
            class="templateActivity"
            data-week="${week}"
            data-day="${escapeHtml(day)}"
            oninput="applyTextareaColor(this)"
          >${escapeHtml(value)}</textarea>
        </td>
      `;
    });

    html += `</tr>`;
  }

  html += `
        </tbody>
      </table>
    </div>
  `;

  box.innerHTML = html;

  box
    .querySelectorAll(".templateActivity")
    .forEach(applyTextareaColor);
}

function collectTemplateItems(skipEmpty = true){
  const items = [];

  document
    .querySelectorAll("#templateEditorBox .templateActivity")
    .forEach(textarea=>{
      const activity =
        String(textarea.value || "").trim();

      if(skipEmpty && !activity) return;

      items.push({
        week:Number(textarea.dataset.week || 0),
        day:String(textarea.dataset.day || ""),
        activity
      });
    });

  return items;
}

async function saveStudyPlanTemplate(){
  const name =
    String(
      document.getElementById("templateName").value || ""
    ).trim();

  const duration =
    Number(
      document.getElementById("templateDuration").value || 0
    );

  if(!name){
    alert("اكتب اسم الخطة");
    return;
  }

  if(!duration || duration < 1){
    alert("اختر مدة صحيحة للخطة");
    return;
  }

  const items =
    collectTemplateItems(true);

  if(!items.length){
    alert("أدخل نشاطاً واحداً على الأقل");
    return;
  }

  try{
    const payload = {
      name,
      duration,
      items,
      updatedAt:
        firebase.firestore.FieldValue.serverTimestamp()
    };

    let savedId = ACTIVE_TEMPLATE_ID;

    if(savedId){
      await db
        .collection("StudyPlanTemplates")
        .doc(savedId)
        .set(payload,{merge:true});
    }else{
      payload.createdAt =
        firebase.firestore.FieldValue.serverTimestamp();

      const ref = await db
        .collection("StudyPlanTemplates")
        .add(payload);

      savedId = ref.id;
    }

    await loadSavedPlans();

    document.getElementById("savedPlanSelect").value =
      savedId;

    ACTIVE_TEMPLATE_ID = savedId;

    alert("✅ تم حفظ الخطة الدراسية");

    closeSavedPlanModal();

  }catch(error){
    console.error(error);
    alert("حدث خطأ أثناء حفظ الخطة");
  }
}

async function deleteSavedPlanTemplate(){
  if(!ACTIVE_TEMPLATE_ID){
    alert("لا توجد خطة محددة للحذف");
    return;
  }

  if(!confirm("هل تريد حذف الخطة المحفوظة؟")){
    return;
  }

  try{
    await db
      .collection("StudyPlanTemplates")
      .doc(ACTIVE_TEMPLATE_ID)
      .delete();

    await loadSavedPlans();

    document.getElementById("savedPlanSelect").value = "";

    closeSavedPlanModal();

    alert("✅ تم حذف الخطة المحفوظة");

  }catch(error){
    console.error(error);
    alert("حدث خطأ أثناء حذف الخطة");
  }
}


function normalizeTemplateItems(items){
  return [...items]
    .map(item=>({
      week:Number(item.week || 0),
      day:String(item.day || "").trim(),
      activity:String(item.activity || "").trim()
    }))
    .filter(item=>
      item.week > 0 &&
      item.day &&
      item.activity
    )
    .sort((a,b)=>{
      if(a.week !== b.week){
        return a.week - b.week;
      }

      return a.day.localeCompare(b.day,"ar");
    });
}

function createTemplateSignature(items){
  return JSON.stringify(
    normalizeTemplateItems(items)
  );
}

function buildImportedTemplateName(course){
  const parts = [
    course.TrainingCourse,
    course.Section,
    course.Branch,
    course.Period,
    course.StartingDate
  ]
    .map(value=>String(value || "").trim())
    .filter(Boolean);

  return parts.length
    ? `خطة ${parts.join(" - ")}`
    : "خطة دراسية مستوردة";
}

async function importExistingCoursePlansAsTemplates(){

  if(!COURSES.length){
    alert("لا توجد دورات متاحة");
    return;
  }

  const confirmed = confirm(
    "سيتم تحويل الخطط السابقة الموجودة داخل الدورات إلى خطط محفوظة مستقلة. لن يتم حذف أو تغيير الخطط الحالية في الدورات. هل تريد المتابعة؟"
  );

  if(!confirmed){
    return;
  }

  const button =
    document.querySelector(".import-old-plans-btn");

  const oldButtonHtml =
    button ? button.innerHTML : "";

  if(button){
    button.disabled = true;
    button.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> جاري الاستيراد...';
  }

  try{

    /*
      تحميل جميع الخطط السابقة مرة واحدة.
    */
    const plansSnap =
      await db.collection("StudyPlans").get();

    const plansByCourse = {};

    plansSnap.forEach(doc=>{
      const data = doc.data() || {};
      const courseId =
        String(data.courseId || "").trim();

      const activity =
        String(data.activity || "").trim();

      if(!courseId || !activity){
        return;
      }

      if(!plansByCourse[courseId]){
        plansByCourse[courseId] = [];
      }

      plansByCourse[courseId].push({
        week:Number(data.week || 0),
        day:String(data.day || "").trim(),
        activity
      });
    });

    /*
      التوقيعات الموجودة تمنع تكرار خطة سبق حفظها.
    */
    const existingSignatures = new Set(
      SAVED_PLANS.map(plan=>
        createTemplateSignature(
          Array.isArray(plan.items)
            ? plan.items
            : []
        )
      )
    );

    let importedCount = 0;
    let duplicateCount = 0;
    let emptyCount = 0;

    for(const course of COURSES){

      const rawItems =
        plansByCourse[String(course.id)] || [];

      const items =
        normalizeTemplateItems(rawItems);

      if(!items.length){
        emptyCount++;
        continue;
      }

      const signature =
        createTemplateSignature(items);

      if(existingSignatures.has(signature)){
        duplicateCount++;
        continue;
      }

      const maxWeek =
        Math.max(
          ...items.map(item=>Number(item.week || 1)),
          1
        );

      const courseDuration =
        getCourseDuration(course);

      const duration =
        Math.max(
          maxWeek,
          Number(courseDuration || 1)
        );

      await db
        .collection("StudyPlanTemplates")
        .add({
          name:buildImportedTemplateName(course),
          duration,
          items,
          importedFromCourseId:String(course.id),
          importedFromCourseName:
            String(course.TrainingCourse || ""),
          importedAt:
            firebase.firestore.FieldValue.serverTimestamp(),
          createdAt:
            firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt:
            firebase.firestore.FieldValue.serverTimestamp()
        });

      existingSignatures.add(signature);
      importedCount++;
    }

    await loadSavedPlans();

    alert(
      `✅ اكتمل استيراد الخطط السابقة\n\n` +
      `الخطط الجديدة المحفوظة: ${importedCount}\n` +
      `الخطط المتطابقة التي لم تُكرر: ${duplicateCount}\n` +
      `الدورات التي لا تحتوي خطة: ${emptyCount}`
    );

  }catch(error){

    console.error(error);

    alert(
      "حدث خطأ أثناء استيراد الخطط السابقة"
    );

  }finally{

    if(button){
      button.disabled = false;
      button.innerHTML = oldButtonHtml;
    }
  }
}

async function applySavedPlanToFilteredCourses(){
  const templateId =
    document.getElementById("savedPlanSelect").value;

  if(!templateId){
    alert("اختر خطة محفوظة");
    return;
  }

  if(!FILTERED_COURSES.length){
    alert("لا توجد دورات مفلترة لربط الخطة بها");
    return;
  }

  const template =
    SAVED_PLANS.find(plan=>plan.id === templateId);

  if(!template){
    alert("الخطة المحفوظة غير موجودة");
    return;
  }

  const items =
    Array.isArray(template.items)
      ? template.items
      : [];

  if(!items.length){
    alert("الخطة المحفوظة فارغة");
    return;
  }

  const message =
    FILTERED_COURSES.length === 1
      ? `سيتم ربط الخطة بالدورة المحددة. هل تريد المتابعة؟`
      : `سيتم ربط الخطة بعدد ${FILTERED_COURSES.length} دورة مفلترة. هل تريد المتابعة؟`;

  if(!confirm(message)){
    return;
  }

  try{
    for(const course of FILTERED_COURSES){

      /*
        حذف الخطة القديمة للدورة أولاً حتى يصبح الربط مطابقاً
        للخطة المحفوظة، ولا تبقى خلايا قديمة غير موجودة بالقالب.
      */
      const oldSnap =
        await db.collection("StudyPlans")
          .where("courseId","==",course.id)
          .get();

      const deleteBatch = db.batch();

      oldSnap.forEach(doc=>{
        deleteBatch.delete(doc.ref);
      });

      await deleteBatch.commit();

      const writeBatch = db.batch();

      items.forEach(item=>{
        const week = Number(item.week || 0);
        const day = String(item.day || "");
        const activity = String(item.activity || "").trim();

        if(!week || !day || !activity) return;

        const id =
          `${course.id}_${week}_${day}`;

        const ref =
          db.collection("StudyPlans").doc(id);

        writeBatch.set(ref,{
          courseId:course.id,
          templateId,
          templateName:template.name || "",
          week,
          day,
          activity,
          updatedAt:
            firebase.firestore.FieldValue.serverTimestamp()
        });
      });

      await writeBatch.commit();
    }

    for(const course of FILTERED_COURSES){
      await loadStudyPlan(course.id);
    }

    alert("✅ تم ربط الخطة المحفوظة بالدورات المفلترة");

  }catch(error){
    console.error(error);
    alert("حدث خطأ أثناء ربط الخطة بالدورات");
  }
}
