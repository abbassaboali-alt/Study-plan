/* 1) الصفحة بكامل العرض بدون أي هوامش */
html, body{
  margin:0 !important;
  padding:0 !important;
  width:100% !important;
  max-width:100% !important;
  overflow-x:hidden !important;
}

/* 2) كل العناصر داخل الصفحة لا تكسر العرض */
*,
*::before,
*::after{
  box-sizing:border-box !important;
}

/* 3) كسر أي حاويات من القالب قد تقيد العرض */
.container, .section, .wrapper, .content, .main-content,
#page, #main, #body, #content,
[class*="container"], [class*="wrapper"], [class*="content"]{
  width:100% !important;
  max-width:100% !important;
  margin:0 !important;
  padding:0 !important;
}

/* 4) هوامش داخلية عامة (تضييق الهوامش) */
:root{
  --gutter: 6px;          /* ✅ غيّرها 4px أو 8px حسب رغبتك */
  --radius: 14px;
}

/* أي عنصر رئيسي في الصفحة خليه يستفيد من الـ gutter */
body{
  font-family:'Tajawal', sans-serif;
  background:#f4f6fb;
  padding:var(--gutter) !important;  /* ✅ يديك هامش صغير جدًا حول الصفحة */
}

/* 5) تقليل هوامش عناصر واجهتك (بدون ما تخرب التصميم) */
.logout-badge,
.header,
.actions,
.stats,
.filters,
.wrap{
  margin:var(--gutter) !important;
}

/* 6) تحسين العرض على الجوال (هوامش أضيق + تكبير لمس) */

  :root{ --gutter: 4px; }
  .header{ font-size:18px !important; }

  .btn{ padding:10px 12px !important; }
}

/* 7) الجدول: اجعله يتمدد ولا يخرج خارج الشاشة */
table{
  width:max-content;
  max-width:100%;
}
.course-body{
  overflow-x:auto !important;
  -webkit-overflow-scrolling:touch;
}

/* 8) منع أي عنصر يسبب سكرول أفقي بالقوة */
img, video, canvas{
  max-width:100% !important;
  height:auto !important;
}

/* ================= HELPERS ================= */
function escapeHtml(str){
  return String(str ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function formatPeriodSort(v){
  return String(v || "").trim();
}
function getCourseDuration(course){

  const raw =
    course.Duration ??
    course.Weeks ??
    course.duration ??
    course.weeks ??
    "";

  const text =
    String(raw)
      .trim()
      .toLowerCase();

  /* قيمة رقمية مباشرة */
  const numericValue = Number(text);

  if(
    Number.isFinite(numericValue) &&
    numericValue > 0
  ){
    return numericValue;
  }

  /* القيم العربية */
  if(
    text === "أسبوع" ||
    text === "اسبوع" ||
    text === "أسبوع واحد" ||
    text === "اسبوع واحد"
  ){
    return 1;
  }

  if(
    text === "أسبوعان" ||
    text === "اسبوعان" ||
    text === "أسبوعين" ||
    text === "اسبوعين"
  ){
    return 2;
  }

  /* القيم الإنجليزية */
  if(
    text === "1 week" ||
    text === "one week"
  ){
    return 1;
  }

  if(
    text === "2 weeks" ||
    text === "two weeks"
  ){
    return 2;
  }

  /* استخراج أي رقم داخل النص */
  const match =
    text.match(/\d+/);

  if(match){

    const extracted =
      Number(match[0]);

    if(
      Number.isFinite(extracted) &&
      extracted > 0
    ){
      return extracted;
    }

  }

  /* مدة افتراضية عند عدم وجود قيمة صالحة */
  return 8;
}

function getCurrentWeek(startDate, duration){
  const start = new Date(startDate || 0);
  const now = new Date();

  if(isNaN(start.getTime())) return -1;

  const diffWeeks = Math.floor((now - start) / (1000*60*60*24*7)) + 1;

  if(diffWeeks < 1 || diffWeeks > duration) return -1;
  return diffWeeks;
}

async function tryAddImage(doc, url, x, y, w, h){
  try{
    const dataUrl = await urlToDataURL(url);
    doc.addImage(dataUrl, "PNG", x, y, w, h);
    return true;
  }catch(e){
    console.warn("Logo failed:", e);
    return false;
  }
}

function urlToDataURL(url){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function(){
      try{
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        resolve(canvas.toDataURL("image/png"));
      }catch(err){
        reject(err);
      }
    };
    img.onerror = reject;
    img.src = url;
  });
}

function getPlanColorClass(text){

  const t = String(text || "").trim().toLowerCase();

  if(!t) return "";

  if(t.includes("final exam") || t.includes("final")){
    return "plan-final";
  }

  if(t.includes("midterm exam") || t.includes("midterm")){
    return "plan-midterm";
  }

  if(t.includes("quiz")){
    return "plan-quiz";
  }

  if(
    t.includes("activity") ||
    t.includes("reading") ||
    t.includes("listening") ||
    t.includes("speaking") ||
    t.includes("writing") ||
    t.includes("vocabulary") ||
    t.includes("grammar") ||
    t.includes("skills")
  ){
    return "plan-activity";
  }

  return "plan-normal";
}

}

async function saveAllChanges(){

  const button =
    document.getElementById("saveAllChangesBtn");

  const status =
    document.getElementById("saveAllStatus");

  const selectedIds = new Set(getSelectedPdfCourseIds());

  if(!selectedIds.size){
    alert("حدد جدولاً واحداً على الأقل من مربع PDF/التحديد أعلى الجدول");
    return;
  }

  const textareas = [
    ...document.querySelectorAll(
      '#planBox textarea[data-course][data-week][data-day]'
    )
  ].filter(textarea => selectedIds.has(String(textarea.dataset.course || "")));

  if(!textareas.length){
    alert("لا توجد خطط ظاهرة للحفظ");
    return;
  }

  const changed = textareas.filter(textarea=>{
    const original =
      String(textarea.dataset.originalValue || "");

    const current =
      String(textarea.value || "");

    return current !== original;
  });

  if(!changed.length){
    alert("لا توجد تعديلات جديدة للحفظ");
    return;
  }

  const oldHtml = button.innerHTML;

  button.disabled = true;
  button.innerHTML =
    '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

  status.style.display = "block";
  status.style.background = "#eff6ff";
  status.style.borderColor = "#bfdbfe";
  status.style.color = "#164478";
  status.textContent =
    `جاري حفظ ${changed.length} تعديل...`;

  try{

    let savedCount = 0;
    let deletedCount = 0;

    const chunkSize = 400;

    for(
      let startIndex = 0;
      startIndex < changed.length;
      startIndex += chunkSize
    ){

      const chunk =
        changed.slice(
          startIndex,
          startIndex + chunkSize
        );

      const batch = db.batch();

      chunk.forEach(textarea=>{

        const courseId =
          String(textarea.dataset.course || "");

        const week =
          Number(textarea.dataset.week || 0);

        const day =
          String(textarea.dataset.day || "");

        const activity =
          String(textarea.value || "").trim();

        const id =
          `${courseId}_${week}_${day}`;

        const ref =
          db.collection("StudyPlans").doc(id);

        if(activity){

          batch.set(ref,{
            courseId,
            week,
            day,
            activity,
            updatedAt:
              firebase.firestore
                .FieldValue
                .serverTimestamp()
          });

          savedCount++;

        }else{

          batch.delete(ref);
          deletedCount++;
        }
      });

      await batch.commit();
    }

    changed.forEach(textarea=>{

      textarea.dataset.originalValue =
        String(textarea.value || "");

      textarea.classList.remove("plan-dirty");

      textarea.style.borderColor = "#2ecc71";

      setTimeout(()=>{
        textarea.style.borderColor = "#d7deea";
      },900);
    });

    status.style.background = "#ecfdf5";
    status.style.borderColor = "#86efac";
    status.style.color = "#166534";
    status.textContent =
      `✅ تم حفظ جميع التعديلات — حفظ: ${savedCount} — حذف: ${deletedCount}`;

    setTimeout(()=>{
      status.style.display = "none";
    },3500);

  }catch(error){

    console.error(error);

    status.style.background = "#fef2f2";
    status.style.borderColor = "#fecaca";
    status.style.color = "#991b1b";
    status.textContent =
      "حدث خطأ أثناء حفظ التعديلات";

    alert("حدث خطأ أثناء حفظ جميع التعديلات");

  }finally{

    button.disabled = false;
    button.innerHTML = oldHtml;
  }
}

      ).value || ""
    ).trim();

  if(!text){

    alert("اكتب النشاط");

    return;

async function exportPlanPDF(){

  const statusBox = document.getElementById("pdfStatus");

  try{

    if(!FILTERED_COURSES.length){
      alert("لا توجد دورات");
      return;
    }

    const selectedCourseIds =
      getSelectedPdfCourseIds();

    if(!selectedCourseIds.length){
      alert("حدد جدولاً واحداً على الأقل للطباعة PDF");
      return;
    }

    const selectedIdSet =
      new Set(selectedCourseIds);

    const coursesForPdf =
      FILTERED_COURSES.filter(course=>
        selectedIdSet.has(String(course.id))
      );

    if(!coursesForPdf.length){
      alert("لم يتم العثور على الجداول المحددة");
      return;
    }

    if(statusBox){
      statusBox.style.display = "block";
      statusBox.textContent = `جاري تجهيز PDF لـ ${coursesForPdf.length} جدول محدد...`;
    }

    await new Promise(resolve => setTimeout(resolve, 80));

    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({
      orientation:"landscape",
      unit:"mm",
      format:"a4",
      compress:true
    });

    const BLUE = [22,68,120];
    const BLUE_DARK = [13,47,82];
    const LIGHT = [245,248,252];
    const W = doc.internal.pageSize.getWidth();
    const H = doc.internal.pageSize.getHeight();

    const sortedCourses = [...coursesForPdf].sort((a,b)=>
      String(a.TrainingCourse || "").localeCompare(
        String(b.TrainingCourse || ""),
        "en",
        {sensitivity:"base"}
      )
    );

    if(statusBox){
      statusBox.textContent = "جاري تحميل الشعار مرة واحدة...";
    }

    let logoData = null;
    try{
      logoData = await urlToDataURL(LOGO_URL);
    }catch(e){
      console.warn("Logo failed:", e);
      logoData = null;
    }

    if(statusBox){
      statusBox.textContent = "جاري تحميل الخطط من قاعدة البيانات...";
    }

    const courseIds = new Set(sortedCourses.map(c => String(c.id)));
    const plansByCourse = {};

    const allPlansSnap = await db.collection("StudyPlans").get();

    allPlansSnap.forEach(d=>{
      const p = d.data() || {};
      const cid = String(p.courseId || "");

      if(!courseIds.has(cid)) return;

      if(!plansByCourse[cid]) plansByCourse[cid] = {};
      plansByCourse[cid][`${p.week}_${p.day}`] = p.activity || "";
    });

    let first = true;
    let index = 0;

    for(const course of sortedCourses){

      index++;

      if(statusBox){
        statusBox.textContent = `جاري إصدار PDF للدورة ${index} من ${sortedCourses.length}...`;
      }

      if(!first) doc.addPage();
      first = false;

      const duration =
  getCourseDuration(course);

      // ===== Header compact with logo =====
      doc.setFillColor(...BLUE);
      doc.rect(0,0,W,22,"F");

      if(logoData){
        doc.setFillColor(255,255,255);
        doc.roundedRect(8,3,17,16,2,2,"F");
        doc.addImage(logoData,"PNG",10,4.5,13,13);
      }else{
        doc.setTextColor(255,255,255);
        doc.setFont("helvetica","bold");
        doc.setFontSize(9);
        doc.text("PRUDLE", 10, 13);
      }

      doc.setTextColor(255,255,255);
      doc.setFont("helvetica","bold");
      doc.setFontSize(17);
      doc.text("PRUDLE STUDY PLAN", W/2, 9, {align:"center"});

      doc.setFontSize(10);
      doc.text(String(course.TrainingCourse || "-"), W/2, 17, {align:"center"});

      // ===== Course details in compact chips =====
      doc.setTextColor(20,30,45);
      doc.setFontSize(8);
      doc.setFont("helvetica","bold");

      const details = [
        `Course: ${course.TrainingCourse || "-"}`,
        `Trainer: ${course.Trainer || "-"}`,
        `Period: ${course.Period || "-"}`,
        `Start: ${course.StartingDate || "-"}`,
        `Duration: ${duration} Weeks`,
        `Branch: ${course.Branch || "-"}`,
        `Section: ${course.Section || "-"}`
      ];

      let x = 8;
      let y = 27;
      details.forEach((txt)=>{
        const clean = String(txt).slice(0,48);
        const chipW = Math.min(Math.max(doc.getTextWidth(clean) + 7, 30), 78);
        if(x + chipW > W - 8){
          x = 8;
          y += 7;
        }
        doc.setFillColor(...LIGHT);
        doc.setDrawColor(210,220,235);
        doc.roundedRect(x, y-4.5, chipW, 6, 1.5, 1.5, "FD");
        doc.text(clean, x+3, y);
        x += chipW + 3;
      });

      const map = plansByCourse[String(course.id)] || {};

      const daysAR = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
      const daysEN = ["Sunday","Monday","Tuesday","Wednesday","Thursday"];

      const head = [["Week", ...daysEN]];

          row.push(String(map[`${w}_${day}`] || "").trim());
        });
        body.push(row);
      }

      const tableStartY = Math.max(42, y + 6);
      const marginX = 6;
      const usableW = W - (marginX*2);
      const weekW = 18;
      const dayW = (usableW - weekW) / 5;

      doc.autoTable({
        startY:tableStartY,
        theme:"grid",
        head,
        body,
        margin:{left:marginX,right:marginX,bottom:18},
        tableWidth:usableW,
        pageBreak:"auto",
        rowPageBreak:"avoid",
        headStyles:{
          fillColor:BLUE,
          textColor:[255,255,255],
          fontStyle:"bold",
          halign:"center",
          valign:"middle",
          fontSize:7.5,
          cellPadding:1.8,
          minCellHeight:6
        },
        styles:{

          1:{cellWidth:dayW},
          2:{cellWidth:dayW},
          3:{cellWidth:dayW},
          4:{cellWidth:dayW},
          5:{cellWidth:dayW}
        },
        didParseCell:function(data){

          if(data.section === "body" && data.column.index > 0){

            const txt = String(data.cell.raw || "").trim().toLowerCase();

            if(txt.includes("final exam") || txt.includes("final")){
              data.cell.styles.fillColor = [220,53,69];
              data.cell.styles.textColor = [255,255,255];
              data.cell.styles.fontStyle = "bold";
            }
            else if(txt.includes("midterm exam") || txt.includes("midterm")){
              data.cell.styles.fillColor = [255,193,7];
              data.cell.styles.textColor = [0,0,0];
              data.cell.styles.fontStyle = "bold";
            }
            else if(txt.includes("quiz")){
              data.cell.styles.fillColor = [13,110,253];
              data.cell.styles.textColor = [255,255,255];
              data.cell.styles.fontStyle = "bold";
            }
            else if(
              txt.includes("activity") ||
              txt.includes("reading") ||
              txt.includes("listening") ||
              txt.includes("speaking") ||
              txt.includes("writing") ||
              txt.includes("vocabulary") ||
              txt.includes("grammar")
            ){
              data.cell.styles.fillColor = [25,135,84];
              data.cell.styles.textColor = [255,255,255];
              data.cell.styles.fontStyle = "bold";
            }
            else if(txt){
              data.cell.styles.fillColor = [255,250,225];
              data.cell.styles.textColor = [35,35,35];
            }
          }
        },
        didDrawPage:function(){
          doc.setFontSize(7);
          doc.setTextColor(120);
          doc.text("Prudle Institute - Study Plan", marginX, H-6);
          doc.text(`Page ${doc.internal.getCurrentPageInfo().pageNumber}`, W-marginX, H-6, {align:"right"});
        }
      });

      // ===== Compact color guide =====
      let finalY = (doc.lastAutoTable && doc.lastAutoTable.finalY ? doc.lastAutoTable.finalY : tableStartY) + 6;

      if(finalY > H - 20){
        finalY = H - 18;
      }

      doc.setFontSize(7.2);
      doc.setTextColor(0);
      doc.setFont("helvetica","bold");
      doc.text("Color Guide:", marginX, finalY);

      const guide = [
        {c:[220,53,69], t:"Final"},
        {c:[255,193,7], t:"Midterm"},
        {c:[13,110,253], t:"Quiz"},
        {c:[25,135,84], t:"Activity / Skills"}
      ];

      let gx = marginX + 24;
      guide.forEach(g=>{
        doc.setFillColor(...g.c);
        doc.rect(gx, finalY-4, 4, 4, "F");
        doc.setTextColor(0);
        doc.text(g.t, gx+6, finalY);
        gx += doc.getTextWidth(g.t) + 18;
      });

      await new Promise(resolve => setTimeout(resolve, 15));
    }

    if(statusBox){
      statusBox.textContent = "جاري تنزيل ملف PDF...";
    }

    doc.save("Prudle_StudyPlan_Report.pdf");

  }catch(err){

    console.error(err);
    alert("حدث خطأ أثناء إصدار PDF");

  }finally{

    if(statusBox){
      setTimeout(()=>{
        statusBox.style.display = "none";
      }, 1200);
    }

  }
}

async function loadSavedPlans(){
  try{
    const snap = await db.collection("StudyPlanTemplates").get();

    SAVED_PLANS = snap.docs
      .map(doc=>({
        id:doc.id,
        ...doc.data()
      }))
      .sort((a,b)=>{
        const favDiff = Number(Boolean(b.favorite)) - Number(Boolean(a.favorite));
        if(favDiff) return favDiff;
        return String(a.name || "").localeCompare(
          String(b.name || ""),
          "ar"
        );
      });

    buildSavedPlanDropdown();

  }catch(error){
    console.error("Could not load saved plans:",error);
  }
}

function buildSavedPlanDropdown(){
  const select =
    document.getElementById("savedPlanSelect");

  if(!select) return;

  const oldValue = select.value;

  select.innerHTML =
    '<option value="">اختر خطة محفوظة</option>';

  SAVED_PLANS.forEach(plan=>{
    const option =
      document.createElement("option");

    option.value = plan.id;
    option.textContent =
      `${plan.favorite ? "⭐ " : ""}${plan.locked ? "🔒 " : ""}${plan.name || "خطة بدون اسم"} — ${Number(plan.duration || 1)} Weeks`;

    select.appendChild(option);
  });

  if(SAVED_PLANS.some(plan=>plan.id === oldValue)){
    select.value = oldValue;
  }

  updateFavoriteSavedPlanButton();
}

function updateFavoriteSavedPlanButton(){
  const select = document.getElementById("savedPlanSelect");
  const button = document.getElementById("favoriteSavedPlanBtn");
  if(!button || !select) return;

  const plan = SAVED_PLANS.find(p=>p.id === select.value);
  const favorite = Boolean(plan?.favorite);

  button.disabled = !plan;
  button.classList.toggle("is-favorite", favorite);
  button.innerHTML = favorite
    ? '<i class="fa-solid fa-star"></i> مميزة'
    : '<i class="fa-regular fa-star"></i> تمييز';
}

  ACTIVE_TEMPLATE_ID = planId || null;

    document.getElementById("templateName");

function renderTemplateEditor(duration,items = []){
  const box =
    document.getElementById("templateEditorBox");

  if(!box) return;

  const days = [
    "الأحد",
    "الاثنين",
    "الثلاثاء",
    "الأربعاء",
    "الخميس"
  ];

  const itemMap = {};

  items.forEach(item=>{
    itemMap[
      `${Number(item.week)}_${String(item.day || "")}`
    ] = String(item.activity || "");
  });

  let html = `
    <div class="template-grid-wrap">
      <table class="template-grid">
        <thead>
          <tr>
            <th style="width:85px">الأسبوع</th>
  `;

  days.forEach(day=>{
    html += `<th>${escapeHtml(day)}</th>`;
  });

  html += `
          </tr>
        </thead>
        <tbody>
  `;

  for(let week = 1; week <= duration; week++){
    html += `
      <tr>
        <td><b>الأسبوع ${week}</b></td>
    `;

    days.forEach(day=>{
      const value =
        itemMap[`${week}_${day}`] || "";

      html += `
        <td>
          <textarea
            class="templateActivity"
            data-week="${week}"
            data-day="${escapeHtml(day)}"
            oninput="applyTextareaColor(this)"
          >${escapeHtml(value)}</textarea>
        </td>
      `;
    });

    html += `</tr>`;
  }

  html += `
        </tbody>
      </table>
    </div>
  `;

  box.innerHTML = html;

  box
    .querySelectorAll(".templateActivity")
    .forEach(applyTextareaColor);
}

function collectTemplateItems(skipEmpty = true){
  const items = [];

  document
    .querySelectorAll("#templateEditorBox .templateActivity")
    .forEach(textarea=>{
      const activity =
        String(textarea.value || "").trim();

      if(skipEmpty && !activity) return;

      items.push({
        week:Number(textarea.dataset.week || 0),
        day:String(textarea.dataset.day || ""),
        activity
      });
    });

  return items;
}

async function saveStudyPlanTemplate(){
  const currentPlan = SAVED_PLANS.find(p=>p.id === ACTIVE_TEMPLATE_ID);
  if(currentPlan?.locked){
    alert(`🔒 هذه الخطة مقفلة بواسطة ${currentPlan.lockedByName || currentPlan.lockedBy || "Admin"}. افتح القفل أولاً.`);
    return;
  }

  const name =
    String(
      document.getElementById("templateName").value || ""
    ).trim();

  const duration =
    Number(
      document.getElementById("templateDuration").value || 0
    );

  if(!name){
    alert("اكتب اسم الخطة");
    return;
  }

  if(!duration || duration < 1){
    alert("اختر مدة صحيحة للخطة");
    return;
  }

  const items =
    collectTemplateItems(true);

  if(!items.length){
    alert("أدخل نشاطاً واحداً على الأقل");
    return;
  }

  try{
    const payload = {
      name,
      duration,
      items,
      updatedAt:
        firebase.firestore.FieldValue.serverTimestamp()
    };

    let savedId = ACTIVE_TEMPLATE_ID;

    if(savedId){
      await db
        .collection("StudyPlanTemplates")
        .doc(savedId)
        .set(payload,{merge:true});
    }else{
      payload.createdAt =
        firebase.firestore.FieldValue.serverTimestamp();

      const ref = await db
        .collection("StudyPlanTemplates")
        .add(payload);

      savedId = ref.id;
    }

    await loadSavedPlans();

    document.getElementById("savedPlanSelect").value =
      savedId;

    ACTIVE_TEMPLATE_ID = savedId;

    alert("✅ تم حفظ الخطة الدراسية");

    closeSavedPlanModal();

  }catch(error){
    console.error(error);
    alert("حدث خطأ أثناء حفظ الخطة");
  }
}

async function deleteSavedPlanTemplate(){
  if(!ACTIVE_TEMPLATE_ID){
    alert("لا توجد خطة محددة للحذف");
    return;
  }

  const currentPlan = SAVED_PLANS.find(p=>p.id === ACTIVE_TEMPLATE_ID);

    alert(`🔒 لا يمكن حذف الخطة وهي مقفلة بواسطة ${currentPlan.lockedByName || currentPlan.lockedBy || "Admin"}.`);

  }
}


function getCurrentAdminName(){
  /*
    لا نعتمد على role هنا لأن صفحة الدخول الحالية قد تحفظ اسم المستخدم
    بدون role، أو تحفظه تحت مفتاح مختلف. هوية القفل تعتمد على اسم الحساب
    المسجل فعلياً في localStorage.
  */
  const keys = [
    "username",
    "adminUsername",
    "loggedInUser",
    "user"
  ];

  for(const key of keys){
    const value = String(localStorage.getItem(key) || "").trim();
    if(value) return value;
  }

  return "";
}

function normalizeAdminValue(value){
  return String(value ?? "").trim().toLowerCase();
}

async function verifyCurrentAdminPassword(){
  const username = getCurrentAdminName();

  if(!username){
    alert("لم يتم العثور على اسم المستخدم المسجل. سجل الدخول من صفحة الإدارة ثم حاول مرة أخرى.");
    return false;
  }

  const password = prompt(`أدخل كلمة مرور Admin:\n${username}`);
  if(password === null) return false;

  try{
    let userData = null;

    /* 1) إذا كان Document ID هو اسم المستخدم */
    try{
      const direct = await db.collection("users").doc(username).get();
      if(direct.exists){
        userData = direct.data() || {};
      }
    }catch(e){
      console.warn("Direct admin lookup failed",e);
    }

    /* 2) دعم اختلاف أسماء الحقول في مجموعة users */
    if(!userData){
      const snap = await db.collection("users").get();
      const wanted = normalizeAdminValue(username);

      snap.forEach(doc=>{
        if(userData) return;

        const data = doc.data() || {};
        const candidates = [
          doc.id,
          data.username,
          data.Username,
          data.userName,
          data.user,
          data.User,
          data.name,
          data.Name
        ];

        const matched = candidates.some(v =>
          normalizeAdminValue(v) === wanted
        );

        if(matched){
          userData = data;
        }
      });
    }

    if(!userData){
      alert(`لم يتم العثور على حساب المستخدم ${username} في users`);
      return false;
    }

    const storedPassword = String(
      userData.password ??
      userData.Password ??
      userData.pass ??
      userData.Pass ??
      userData.userPassword ??
      ""
    );

    if(!storedPassword){
      alert("حساب Admin موجود، لكن لم يتم العثور على حقل كلمة المرور.");
      return false;
    }

    /*
      إذا كان للحساب role نتحقق منه. إذا لم يكن الحقل موجوداً فلا نرفضه،
      لأن نظام الدخول في الصفحة الأصلية هو المسؤول عن صلاحية الدخول.
    */
    const roleValue = String(
      userData.role ??
      userData.Role ??
      userData.type ??
      userData.Type ??
      ""
    ).trim();

    if(roleValue && normalizeAdminValue(roleValue) !== "admin"){
      alert("هذا الحساب ليس Admin");
      return false;
    }

    if(storedPassword !== String(password)){
      alert("كلمة المرور غير صحيحة");
      return false;
    }

    return true;

  }catch(e){
    console.error(e);
    alert("تعذر التحقق من حساب Admin");
    return false;
  }
}

function updateTemplateLockUI(plan){

  if(info){

    info.innerHTML = locked
      ? `🔒 الخطة مقفلة — Locked by: <b>${escapeHtml(owner || "Admin")}</b>`
      : "🔓 الخطة غير مقفلة";
  }
  if(lockBtn){
    lockBtn.style.display = plan ? "inline-flex" : "none";
    lockBtn.innerHTML = locked
      ? '<i class="fa-solid fa-lock-open"></i> فتح القفل'
      : '<i class="fa-solid fa-lock"></i> قفل الخطة';
  }
  document.querySelectorAll("#templateEditorBox .templateActivity").forEach(el=>el.disabled=locked);
  const name = document.getElementById("templateName");
  const duration = document.getElementById("templateDuration");
  if(name) name.disabled = locked;
  if(duration) duration.disabled = locked;
  if(saveBtn) saveBtn.disabled = locked;
  if(deleteBtn) deleteBtn.disabled = locked;
}

function normalizeTemplateItems(items){
  return [...items]
    .map(item=>({
      week:Number(item.week || 0),
      day:String(item.day || "").trim(),
      activity:String(item.activity || "").trim()
    }))
    .filter(item=>
      item.week > 0 &&
      item.day &&
      item.activity
    )
    .sort((a,b)=>{
      if(a.week !== b.week){
        return a.week - b.week;
      }

      return a.day.localeCompare(b.day,"ar");
    });
}

function createTemplateSignature(items){
  return JSON.stringify(
    normalizeTemplateItems(items)
  );
}

function buildImportedTemplateName(course){
  const parts = [
    course.TrainingCourse,
    course.Section,
    course.Branch,
    course.Period,
    course.StartingDate
  ]
    .map(value=>String(value || "").trim())
    .filter(Boolean);

  return parts.length
    ? `خطة ${parts.join(" - ")}`
    : "خطة دراسية مستوردة";
}

async function importSelectedCoursePlanAsTemplate(){

  if(FILTERED_COURSES.length !== 1){
    alert(
      FILTERED_COURSES.length === 0
        ? "فلتر الدورات حتى تظهر دورة واحدة فقط ثم اضغط استيراد."

    );

  const course = FILTERED_COURSES[0];

  const confirmed = confirm(
    `سيتم استيراد خطة هذه الدورة فقط:\n\n${buildImportedTemplateName(course)}\n\nهل تريد المتابعة؟`
  );
  if(!confirmed) return;

  const button = document.querySelector(".import-old-plans-btn");
  const oldButtonHtml = button ? button.innerHTML : "";

  if(button){
    button.disabled = true;
    button.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> جاري الاستيراد...';
  }

  try{
    const snap = await db.collection("StudyPlans")
      .where("courseId","==",String(course.id))
      .get();

    const rawItems = [];
    snap.forEach(doc=>{
      const data = doc.data() || {};
      const activity = String(data.activity || "").trim();

      rawItems.push({
        week:Number(data.week || 0),
        day:String(data.day || "").trim(),

      });

    const items = normalizeTemplateItems(rawItems);

    if(!items.length){
      alert("هذه الدورة لا تحتوي على خطة دراسية محفوظة.");
      return;
    }

    const signature = createTemplateSignature(items);
    const duplicate = SAVED_PLANS.find(plan=>
      createTemplateSignature(
        Array.isArray(plan.items) ? plan.items : []
      ) === signature
    );

    if(duplicate){
      document.getElementById("savedPlanSelect").value = duplicate.id;
      updateFavoriteSavedPlanButton();
      alert("هذه الخطة موجودة مسبقاً ضمن الخطط المحفوظة.");
      return;
    }

    const maxWeek = Math.max(
      ...items.map(item=>Number(item.week || 1)),
      1
    );

    const duration = Math.max(
      maxWeek,
      Number(getCourseDuration(course) || 1)
    );

    const ref = await db.collection("StudyPlanTemplates").add({
      name:buildImportedTemplateName(course),
      duration,
      items,
      favorite:false,
      importedFromCourseId:String(course.id),
      importedFromCourseName:String(course.TrainingCourse || ""),
      importedAt:firebase.firestore.FieldValue.serverTimestamp(),
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    await loadSavedPlans();
    document.getElementById("savedPlanSelect").value = ref.id;
    updateFavoriteSavedPlanButton();

    alert("✅ تم استيراد خطة الدورة المحددة فقط");

  }catch(error){
    console.error(error);
    alert("حدث خطأ أثناء استيراد خطة الدورة المحددة");
  }finally{
    if(button){
      button.disabled = false;
      button.innerHTML = oldButtonHtml;
    }
  }
}

async function applySavedPlanToFilteredCourses(){
  const templateId =
    document.getElementById("savedPlanSelect").value;

  if(!templateId){
    alert("اختر خطة محفوظة");
    return;
  }

  if(!FILTERED_COURSES.length){
    alert("لا توجد دورات مفلترة لربط الخطة بها");
    return;
  }

  const template =
    SAVED_PLANS.find(plan=>plan.id === templateId);

  if(!template){
    alert("الخطة المحفوظة غير موجودة");
    return;
  }

  const items =
    Array.isArray(template.items)
      ? template.items
      : [];

  if(!items.length){
    alert("الخطة المحفوظة فارغة");
    return;
  }

  const message =
    FILTERED_COURSES.length === 1
      ? `سيتم ربط الخطة بالدورة المحددة. هل تريد المتابعة؟`
      : `سيتم ربط الخطة بعدد ${FILTERED_COURSES.length} دورة مفلترة. هل تريد المتابعة؟`;

  if(!confirm(message)){
    return;
  }

  try{
    for(const course of FILTERED_COURSES){

      /*
        حذف الخطة القديمة للدورة أولاً حتى يصبح الربط مطابقاً
        للخطة المحفوظة، ولا تبقى خلايا قديمة غير موجودة بالقالب.
      */
      const oldSnap =
        await db.collection("StudyPlans")
          .where("courseId","==",course.id)
          .get();

      const deleteBatch = db.batch();

      oldSnap.forEach(doc=>{
        deleteBatch.delete(doc.ref);
      });

      await deleteBatch.commit();

      const writeBatch = db.batch();

      items.forEach(item=>{
        const week = Number(item.week || 0);
        const day = String(item.day || "");
        const activity = String(item.activity || "").trim();

        if(!week || !day || !activity) return;

        const id =
          `${course.id}_${week}_${day}`;

        const ref =
          db.collection("StudyPlans").doc(id);

        writeBatch.set(ref,{
          courseId:course.id,
          templateId,
          templateName:template.name || "",
          week,
          day,
          activity,
          updatedAt:
            firebase.firestore.FieldValue.serverTimestamp()
        });
      });

      await writeBatch.commit();
    }

    for(const course of FILTERED_COURSES){
      await loadStudyPlan(course.id);
    }

    alert("✅ تم ربط الخطة المحفوظة بالدورات المفلترة");

  }catch(error){
    console.error(error);
    alert("حدث خطأ أثناء ربط الخطة بالدورات");
  }
}

</script>
